    <!-- Form Pedido -->
    <form action="#" class="pedidos" id="pedidos">
      <h2>Realiza tu pedido</h2>
      <fieldset>
        <legend>Datos Personales</legend>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre Completo</label>
          <input
            type="text"
            class="form-control"
            id="nombre"
            placeholder="Ingresa tu nombre completo"
            required
          />
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input
            type="tel"
            class="form-control"
            id="telefono"
            placeholder="+505 1234-5678"
            required
          />
        </div>
        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección de Entrega</label>
          <input
            type="text"
            class="form-control"
            id="direccion"
            placeholder="Ingresa tu dirección de entrega"
            required
          />
        </div>
      </fieldset>
      <fieldset>
        <legend>Detalles del Pedido</legend>
        <div class="mb-3">
          <label for="producto" class="form-label">Producto</label>
          <select class="form-select" id="producto" required>
            <option value="" disabled selected>Selecciona un producto</option>
            <option value="hamburguesa">Hot Dog $5</option>
            <option value="pizza">Hamburguesa $8</option>
            <option value="ensalada">Pizza $10</option>
            <option value="postre">Taco $7</option>
            <option value="bebida">Pollo Frito $6</option>
            <option value="bebida">Shawarma $8</option>
            <option value="bebida">Sandwich $9</option>
            <option value="bebida">Empanadas $3</option>
            <option value="bebida">Noodles $6</option>
            <option value="bebida">Fish and Chips $12</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="cantidad" class="form-label">Cantidad</label>
          <input
            type="number"
            class="form-control"
            id="cantidad"
            placeholder="Ingresa la cantidad"
            min="1"
            required
          />
        </div>
        <div class="mb-3">
          <label for="comentarios" class="form-label">Comentarios</label>
          <textarea
            class="form-control"
            id="comentarios"
            placeholder="Describe tus preferencias del producto"
          ></textarea>
        </div>
      </fieldset>
      <button type="submit" class="btn">Realizar Pedido</button>
    </form>
    <!-- Footer -->
